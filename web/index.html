<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Cubo Mágico 3D</title>
    <style>
        :root{
            --bg:#1a1a24; --panel:rgba(0,0,0,.4); --indigo:#4f46e5; --indigo-h:#6366f1;
            --rose:#e11d48; --rose-h:#f43f5e; --ring-i:rgba(129,140,248,.5); --ring-r:rgba(251,113,133,.5);
        }
        *{ box-sizing:border-box; }
        html,body{ height:100%; }
        body{
            margin:0; overflow:hidden; background-color:var(--bg);
            touch-action:none; user-select:none;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#fff;
            cursor:default;
        }
        #canvas-container{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }
        .ui-layer{
            position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; display:flex; flex-direction:column;
            justify-content:space-between; padding:18px 20px 28px; z-index:10;
        }
        .pointer-events-auto{ pointer-events:auto; }
        .topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
        h1{
            margin:0; font-size:34px; font-weight:800; letter-spacing:.04em;
            text-shadow:0 3px 14px rgba(0,0,0,.6);
        }
        h1 .accent{ color:#a5b4fc; }
        .buttons{ display:flex; gap:12px; }
        button{
            border:none; color:#fff; font-weight:700; font-size:15px;
            padding:11px 22px; border-radius:11px; cursor:pointer;
            box-shadow:0 10px 25px rgba(0,0,0,.35); transition:background-color .15s, transform .05s;
        }
        button:active{ transform:scale(.95); }
        .btn-indigo{ background:var(--indigo); box-shadow:0 0 0 2px var(--ring-i),0 10px 25px rgba(0,0,0,.35); }
        .btn-indigo:hover{ background:var(--indigo-h); }
        .btn-rose{ background:var(--rose); box-shadow:0 0 0 2px var(--ring-r),0 10px 25px rgba(0,0,0,.35); }
        .btn-rose:hover{ background:var(--rose-h); }
        .footer{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
        .hint{
            background:var(--panel); padding:11px 22px; border-radius:999px;
            font-size:14px; font-weight:500; backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,.1); box-shadow:0 8px 20px rgba(0,0,0,.3);
        }
        .hint b{ color:#a5b4fc; }
        .credit{ font-size:12px; color:rgba(255,255,255,.45); letter-spacing:.02em; }
        .credit a{ color:rgba(255,255,255,.6); text-decoration:none; }
        @media (max-width:640px){
            h1{ font-size:26px; }
            .topbar{ justify-content:center; }
            .hint .kb{ display:none; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="topbar">
            <h1>CUBO <span class="accent">MÁGICO</span></h1>
            <div class="buttons pointer-events-auto">
                <button class="btn-indigo" onclick="shuffleCube()">Embaralhar</button>
                <button class="btn-rose" onclick="resetCube()">Resetar</button>
            </div>
        </div>

        <div class="footer">
            <p class="hint">
                🖱️ Arraste uma peça para girá-la · arraste o fundo para girar a câmera
                <span class="kb"> · ⌨️ Teclas <b>U D L R F B</b> (Shift = inverso), <b>Espaço</b> = embaralhar</span>
            </p>
            <p class="credit">Cubo Mágico 3D &middot; por Joaquim Pedro de Morais Filho</p>
        </div>
    </div>

    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let pivot;
        const cubies = [];

        let moveQueue = [];
        let isAnimating = false;
        let currentMove = null;
        let animProgress = 0;
        let currentSpeed = 0.15;

        let isDragging = false;
        let startEventPos = null;
        let intersectData = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const cubeColors = {
            right: 0xb90000, left: 0xff5900, top: 0xeeeeee,
            bottom: 0xffd500, front: 0x009b48, back: 0x0045ad, inner: 0x111111
        };

        window.onload = function() {
            initThreeJS();
            createCubies();
            setupTouchControls();
            setupKeyboard();
            animate();
        };

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(6, 5, 6);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 4;
            controls.maxDistance = 15;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const d1 = new THREE.DirectionalLight(0xffffff, 0.5); d1.position.set(10, 20, 10); scene.add(d1);
            const d2 = new THREE.DirectionalLight(0xffffff, 0.3); d2.position.set(-10, -20, -10); scene.add(d2);

            pivot = new THREE.Group();
            scene.add(pivot);

            window.addEventListener('resize', onWindowResize, false);
        }

        function createCubies() {
            const geometry = new THREE.BoxGeometry(0.96, 0.96, 0.96);
            const innerMaterial = new THREE.MeshPhongMaterial({ color: cubeColors.inner, shininess: 50 });

            for (let x = -1; x <= 1; x++)
                for (let y = -1; y <= 1; y++)
                    for (let z = -1; z <= 1; z++) {
                        const materials = [
                            x === 1 ? new THREE.MeshPhongMaterial({ color: cubeColors.right, shininess: 50 }) : innerMaterial,
                            x === -1 ? new THREE.MeshPhongMaterial({ color: cubeColors.left, shininess: 50 }) : innerMaterial,
                            y === 1 ? new THREE.MeshPhongMaterial({ color: cubeColors.top, shininess: 50 }) : innerMaterial,
                            y === -1 ? new THREE.MeshPhongMaterial({ color: cubeColors.bottom, shininess: 50 }) : innerMaterial,
                            z === 1 ? new THREE.MeshPhongMaterial({ color: cubeColors.front, shininess: 50 }) : innerMaterial,
                            z === -1 ? new THREE.MeshPhongMaterial({ color: cubeColors.back, shininess: 50 }) : innerMaterial,
                        ];
                        const mesh = new THREE.Mesh(geometry, materials);
                        mesh.position.set(x, y, z);
                        const edges = new THREE.EdgesGeometry(geometry);
                        mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 })));
                        cubies.push(mesh);
                        scene.add(mesh);
                    }
        }

        function setupTouchControls() {
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', (e) => {
                if (isAnimating || moveQueue.length > 0) return;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(cubies, false);
                if (intersects.length > 0) {
                    controls.enabled = false;
                    isDragging = true;
                    startEventPos = { x: e.clientX, y: e.clientY };
                    intersectData = intersects[0];
                }
            }, { capture: true });

            dom.addEventListener('pointermove', (e) => {
                if (!isDragging || !intersectData) return;
                const dx = e.clientX - startEventPos.x;
                const dy = e.clientY - startEventPos.y;
                if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                    determineRotation(intersectData, dx, dy);
                    isDragging = false;
                    intersectData = null;
                }
            });

            const onPointerUp = () => { isDragging = false; intersectData = null; controls.enabled = true; };
            dom.addEventListener('pointerup', onPointerUp);
            dom.addEventListener('pointercancel', onPointerUp);
            dom.addEventListener('pointerleave', onPointerUp);
        }

        // Teclado: notação padrão do cubo (U D L R F B), Shift = movimento inverso
        function setupKeyboard() {
            const map = {
                r: { axis: 'x', layer: 1, direction: -1 },
                l: { axis: 'x', layer: -1, direction: 1 },
                u: { axis: 'y', layer: 1, direction: -1 },
                d: { axis: 'y', layer: -1, direction: 1 },
                f: { axis: 'z', layer: 1, direction: -1 },
                b: { axis: 'z', layer: -1, direction: 1 }
            };
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                const k = e.key.toLowerCase();
                if (k === ' ') { e.preventDefault(); shuffleCube(); return; }
                const m = map[k];
                if (m && !isAnimating && moveQueue.length === 0) {
                    const dir = e.shiftKey ? -m.direction : m.direction;
                    queueMove(m.axis, m.layer, dir);
                }
            });
        }

        function determineRotation(intersect, dx, dy) {
            const dragVec = new THREE.Vector2(dx, -dy).normalize();
            const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
            const worldNormal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();
            const nx = Math.round(worldNormal.x), ny = Math.round(worldNormal.y), nz = Math.round(worldNormal.z);
            const pos = intersect.object.position.clone().round();

            let validAxes = [];
            if (Math.abs(nx) === 1) validAxes = ['y', 'z'];
            else if (Math.abs(ny) === 1) validAxes = ['x', 'z'];
            else if (Math.abs(nz) === 1) validAxes = ['x', 'y'];

            let bestMove = null, maxDot = -Infinity;
            const point3D = intersect.point.clone();
            const screenPoint = point3D.clone().project(camera);

            validAxes.forEach(axis => {
                [-1, 1].forEach(direction => {
                    const axisVector = new THREE.Vector3();
                    axisVector[axis] = 1;
                    const rotatedPoint = point3D.clone().applyAxisAngle(axisVector, direction * (Math.PI / 2));
                    const rotatedScreenPoint = rotatedPoint.project(camera);
                    const moveVec = new THREE.Vector2(
                        rotatedScreenPoint.x - screenPoint.x,
                        rotatedScreenPoint.y - screenPoint.y
                    ).normalize();
                    const dot = dragVec.dot(moveVec);
                    if (dot > maxDot) { maxDot = dot; bestMove = { axis, layer: pos[axis], direction }; }
                });
            });

            if (bestMove && maxDot > 0.3) queueMove(bestMove.axis, bestMove.layer, bestMove.direction);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function queueMove(axis, layer, direction) { moveQueue.push({ axis, layer, direction }); }

        function startMove(move) {
            currentMove = move;
            animProgress = 0;
            currentSpeed = moveQueue.length > 0 ? 0.35 : 0.15;
            cubies.forEach(cubie => {
                if (Math.abs(cubie.position[move.axis] - move.layer) < 0.1) pivot.attach(cubie);
            });
            isAnimating = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isAnimating) {
                const targetAngle = currentMove.direction * (Math.PI / 2);
                const step = currentMove.direction * currentSpeed;
                if (Math.abs(animProgress + step) >= Math.PI / 2) {
                    pivot.rotation[currentMove.axis] = targetAngle;
                    pivot.updateMatrixWorld();
                    [...pivot.children].forEach(child => {
                        scene.attach(child);
                        child.position.x = Math.round(child.position.x);
                        child.position.y = Math.round(child.position.y);
                        child.position.z = Math.round(child.position.z);
                        child.rotation.x = Math.round(child.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                        child.rotation.y = Math.round(child.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                        child.rotation.z = Math.round(child.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
                    });
                    pivot.rotation.set(0, 0, 0);
                    isAnimating = false;
                } else {
                    animProgress += step;
                    pivot.rotation[currentMove.axis] = animProgress;
                }
            } else if (moveQueue.length > 0) {
                startMove(moveQueue.shift());
            }
            renderer.render(scene, camera);
        }

        function shuffleCube() {
            if (moveQueue.length > 0 || isAnimating) return;
            const axes = ['x', 'y', 'z'], layers = [-1, 0, 1], dirs = [1, -1];
            for (let i = 0; i < 25; i++)
                queueMove(axes[Math.floor(Math.random()*3)], layers[Math.floor(Math.random()*3)], dirs[Math.floor(Math.random()*2)]);
        }

        function resetCube() {
            moveQueue = [];
            isAnimating = false;
            cubies.forEach(c => { scene.remove(c); pivot.remove(c); });
            cubies.length = 0;
            pivot.rotation.set(0, 0, 0);
            createCubies();
        }
    </script>
</body>
</html>
